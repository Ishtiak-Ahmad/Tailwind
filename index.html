    <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <title>Product Card</title>
</head>

<body>
    <h2 class="text-[100px] bg-gray-300 text-orange-500 font-bold border-4 border-orange-600 rounded-2xl m-3">Hello Tailwind!</h2>
    <h2 class="text-[25px] sm:text-[30px] md:text-[50px] xl:text-[100px] bg-black text-white md:bg-[#40008aee] md:text-[#60de17] xl:bg-green-600 xl:text-amber-300 font-bold">Hello Tailwind!</h2>
    <h2 class="text-[100px] bg-[url('https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=600')] bg-cover bg-center bg-no-repeat h-[500px] text-[#60de17] font-bold">Hello Tailwind!</h2>

  <div class="w-80 overflow-hidden bg-white rounded-2xl shadow-lg">

    <!-- Product Image -->
    <img
      src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=600"
      alt="Wireless Headphone"
      class="object-cover w-full h-56"
    >

    <!-- Content -->
    <div class="p-5">

      <span class="inline-block px-3 py-1 mb-3 text-sm font-medium text-blue-700 bg-blue-100 rounded-full">
        New Product
      </span>

      <h2 class="mb-2 text-2xl font-bold text-gray-800">
        Wireless Headphone
      </h2>

      <p class="mb-4 text-gray-600">
        High-quality wireless headphone with excellent sound.
      </p>

      <div class="flex items-center justify-between">
        <span class="text-2xl font-bold text-blue-600">
          $49.99
        </span>

        <button class="px-5 py-2 font-semibold text-white bg-blue-600 rounded-lg hover:bg-blue-700">
          Add to Cart
        </button>
      </div>

    </div>
  </div>
  <div class="flex my-6 gap-5 flex-col md:flex-row">
    <div class="h-64 w-full bg-green-400 rounded-2xl p-6.25 border-4 flex justify-center items-center font-bold">Card 1</div>
    <div class="h-64 w-full bg-green-400 rounded-2xl p-6.25 border-4 flex justify-center items-center font-bold">Card 2</div>
    <div class="h-64 w-full bg-green-400 rounded-2xl p-6.25 border-4 flex justify-center items-center font-bold">Card 3</div>
    <div class="h-64 w-full bg-green-400 rounded-2xl p-6.25 border-4 flex justify-center items-center font-bold">Card 4</div>
  </div>

</body>
</html>
</body>
</html>
